name: Build Android APK

# Runs on every push to main, on tags like v4.0.1 (also creates a GitHub Release),
# and manually from the Actions tab (you can type the API address there).
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/build-apk.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API address, e.g. https://my-api.onrender.com/api (leave empty to use the API_URL repo variable)'
        required: false
        default: ''

permissions:
  contents: write   # needed to attach the APK to a Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: ${{ github.event.inputs.api_url || vars.API_URL }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the server address is set
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::API_URL is not set. Go to Settings → Secrets and variables → Actions → Variables and add API_URL = https://YOUR-SERVER/api"
            exit 1
          fi
          case "$VITE_API_URL" in https://*) ;; *) echo "::error::API_URL must start with https://"; exit 1;; esac

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app (mobile mode)
        run: npm run build:mobile

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs

      - name: Generate launcher icon and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath resources

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build debug APK (installable straight away)
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/pulse-track.apk

      # ── Optional: signed release APK (for sharing widely / Play Store) ──────────────
      # Add 4 repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Build signed release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --out ../out/pulse-track-signed.apk aligned.apk
          rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-track-apk
          path: frontend/out/*.apk
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/out/*.apk
          generate_release_notes: true
